# Para VPS que JÁ TEM Traefik nas portas 80/443 (rede externa "proxy", certresolver "letsencrypt").
# Sobe só a loja + banco próprio, sem Caddy:
#   docker compose -f docker-compose.vps.yml -p bloco up -d --build
#
# O endereço vem de DOMAIN no .env (ex.: streetdreams.mentoark.com.br), com HTTPS automático.
# Defina também SITE_URL=https://<DOMAIN> no .env.
# A porta 8088 fica só dentro da VPS (http://127.0.0.1:8088), para manutenção.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:3000"
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.streetdreams.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.streetdreams.entrypoints=websecure
      - traefik.http.routers.streetdreams.tls.certresolver=letsencrypt
      - traefik.http.services.streetdreams.loadbalancer.server.port=3000

networks:
  internal:
  proxy:
    external: true

volumes:
  pgdata:
  uploads:
